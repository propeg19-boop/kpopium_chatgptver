<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST SIGNAL — Kpopium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-left" id="header-left"></div>
    <div class="header-right" id="header-right"></div>
  </header>

  <!-- ============ HOME VIEW: pick a station ============ -->
  <main id="view-home" class="view">
    <section class="home-hero">
      <div class="home-banner" id="home-banner"></div>
      <p class="home-eyebrow">TUNE IN</p>
      <h1 class="home-title">GHOST SIGNAL</h1>
      <p class="home-tagline">a network of late-night frequencies.</p>
    </section>

    <section class="stations-grid" id="stations-grid"></section>
  </main>

  <!-- ============ STATION VIEW: reused for every station ============ -->
  <main id="view-station" class="view" hidden>
    <section class="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-fade"></div>
      <div class="grain"></div>

      <div class="hero-sign hero-sign-left" id="hero-signage"></div>

      <div class="hero-copy">
        <p class="hero-eyebrow" id="station-eyebrow"></p>
        <h1 id="station-name">—</h1>
        <p class="hero-tagline" id="station-tagline"></p>
      </div>

      <div class="scroll-indicator">
        <span>SCROLL</span>
        <span class="scroll-arrow">↓</span>
      </div>
    </section>

    <section class="playlist-section">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">PLAYLIST</p>
          <h2>Tracklist</h2>
        </div>
        <span class="track-count" id="track-count">0 tracks</span>
      </div>
      <div class="playlist-list" id="playlist-list"></div>
    </section>

    <section class="queue-section">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">LATE NIGHTS. LOUD MUSIC.</p>
          <h2>Your Queue</h2>
        </div>
        <span class="queue-count" id="queue-count">0</span>
      </div>
      <div id="queue-body"></div>
    </section>

    <footer class="site-footer">
      <span>GHOST SIGNAL</span>
      <span id="footer-station-tag">DREAM IN PURPLE</span>
    </footer>
  </main>

  <!-- ============ persistent player — never unmounted, only resized ============ -->
  <div class="player" id="player">
    <div class="player-art" id="player-art">
      <div id="yt-player"></div>
    </div>
    <div class="player-info">
      <p class="player-title" id="player-title">—</p>
      <p class="player-artist" id="player-artist">—</p>
      <div class="player-bar">
        <div class="player-bar-fill" id="player-bar-fill"></div>
      </div>
      <div class="player-time">
        <span id="player-elapsed">0:00</span>
        <span id="player-total">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button id="btn-shuffle" class="ctrl-secondary" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="btn-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><rect x="4" y="4" width="2.5" height="16" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="btn-play" class="play-button" aria-label="Play">
        <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>
      </button>
      <button id="btn-next" aria-label="Next">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><rect x="17.5" y="4" width="2.5" height="16" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="btn-repeat" class="ctrl-secondary" aria-label="Repeat" title="Repeat: off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button id="btn-bass-shake" class="ctrl-secondary" aria-label="Bass hit" title="Bass hit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>
    <button id="btn-player-close" class="player-close" aria-label="Stop and close player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>

  <div id="fx-pulse"></div>
  <audio id="sfx-tape" src="assets/sfx/tape-insert.mp3" preload="auto"></audio>

  <script src="stations.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPOPIUM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HOME VIEW ============ -->
  <main id="view-home">
    <p class="home-eyebrow">SELECT A STATION</p>
    <div class="station-grid" id="station-grid"></div>
    <!-- the persistent player docks here (as a fixed mini bar) while on home -->
    <div id="player-slot-home"></div>
  </main>

  <!-- ============ STATION VIEW ============ -->
  <main id="view-station" hidden>
    <section class="station-stage">
      <div class="station-bg-wrap" aria-hidden="true">
        <img class="station-bg" id="station-bg" alt="" decoding="async">
        <div class="station-bg-vignette"></div>
        <div class="station-bg-grain"></div>
      </div>

      <div class="station-stage-content">
        <div class="station-topbar">
          <button class="back-btn" id="back-btn" type="button">&lsaquo; All Stations</button>
          <div class="on-air">
            <span class="on-air-dot" aria-hidden="true"></span>
            ON AIR
          </div>
        </div>

        <div class="station-hero">
          <p class="station-eyebrow" id="station-eyebrow"></p>
          <button class="wordmark" id="wordmark" type="button" aria-label="Station name"></button>
          <p class="station-tagline" id="station-tagline"></p>

          <!-- Player intentionally lives immediately under the station identity. -->
          <div id="player-slot-station"></div>
        </div>
      </div>
    </section>

    <div class="station-panels">
      <section class="panel playlist-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-kicker">THE SOUNDTRACK</p>
            <h2 class="panel-title">Playlist</h2>
          </div>
          <span class="panel-index">01</span>
        </div>
        <div id="playlist-list"></div>
      </section>

      <section class="panel queue-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-kicker">UP NEXT</p>
            <h2 class="panel-title">Queue</h2>
          </div>
          <span class="panel-index">02</span>
        </div>
        <div id="queue-list"></div>
        <div class="queue-actions">
          <button id="play-queue-btn" type="button">Play Queue</button>
          <button id="clear-queue-btn" type="button">Clear</button>
        </div>
      </section>
    </div>
  </main>

  <!-- ============ PERSISTENT PLAYER ============
       Lives outside both views. app.js moves this whole node between
       #player-slot-home and #player-slot-station — it is never removed
       from the DOM or display:none'd, so the YouTube iframe inside it
       keeps playing across navigation. -->
  <div class="player is-idle" id="player">
    <div class="player-art">
      <div id="yt-player-host"></div>
    </div>

    <div class="player-body">
      <div class="player-title" id="player-title">Nothing playing</div>
      <div class="player-subtitle" id="player-subtitle">Pick a station to start</div>
      <div class="player-progress"><div class="player-progress-fill" id="player-progress-fill"></div></div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn ctrl-shuffle" id="btn-shuffle" type="button" aria-label="Shuffle" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 7h9l3 3M21 17l-4 4-4-4M21 17h-9l-3-3M3 7l6 10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ctrl-btn ctrl-prev" id="btn-prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L8 12l11 7V5z" stroke-width="2" stroke-linejoin="round" fill="currentColor" stroke="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-play" id="btn-play" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8V4z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" hidden><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-next" id="btn-next" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7V5z" stroke-width="2" stroke-linejoin="round" fill="currentColor" stroke="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-repeat ctrl-repeat-one" id="btn-repeat" type="button" aria-label="Repeat" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ctrl-repeat-one-badge" id="repeat-one-badge" hidden>1</span>
      </button>
      <button class="ctrl-btn ctrl-bass" id="btn-bass" type="button" aria-label="Bass hit">
        <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
      <button class="ctrl-cancel" id="btn-cancel" type="button" aria-label="Stop and clear player">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="bass-flash" id="bass-flash" aria-hidden="true"></div>

  <!-- script order matters: player.js must define window.onYouTubeIframeAPIReady
       before the YouTube script below runs, so the ready callback is never missed
       regardless of which view the user is on when it fires. -->
  <script src="stations.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
